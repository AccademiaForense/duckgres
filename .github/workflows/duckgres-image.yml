name: duckgres-image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duckgres-image-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a main publication halfway through promoting its tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_TAG: duckgres:ci-${{ github.sha }}

jobs:
  validate:
    name: Build and qualify the all-in-one bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image_id: ${{ steps.export.outputs.image_id }}
      archive_sha256: ${{ steps.export.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Local verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client shellcheck

      - name: Build and publication regression tests
        env:
          GOMAXPROCS: '2'
        run: |
          go test -p 2 ./tests/manifests ./transpiler/... ./scripts/ducklake-candidate/wirecheck
          python3 -B -m unittest discover -s scripts/ducklake-candidate -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/bundle-ci -p 'test_*.py'
          shellcheck -x scripts/ducklake-candidate/*.sh scripts/bundle-ci/*.sh

      - name: Validate bundle source pins
        id: bundle
        run: |
          sh scripts/ducklake-candidate/check-pins.sh go.mod
          echo "patch_sha256=$(sh scripts/ducklake-candidate/patch-digest.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build once, without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TAGS=kubernetes
            PATCH_SHA256=${{ steps.bundle.outputs.patch_sha256 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=duckgres-coherent-bundle-amd64
          cache-to: type=gha,mode=max,scope=duckgres-coherent-bundle-amd64
          provenance: false

      - name: Qualify wire protocol, metadata and S3 on disposable fixtures
        env:
          GOMAXPROCS: '2'
        run: sh scripts/bundle-ci/qualify.sh "$IMAGE_TAG" "$RUNNER_TEMP/bundle-evidence"

      - name: Export only the qualified image
        id: export
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")
          sh scripts/bundle-ci/export.sh "$image_id" "$RUNNER_TEMP/bundle-evidence" "$RUNNER_TEMP/qualified-image"

      - name: Retain qualification evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-qualification
          path: ${{ runner.temp }}/bundle-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Pass the verified image to the publication job
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: qualified-duckgres-image
          path: ${{ runner.temp }}/qualified-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish:
    name: Publish the already-qualified image
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: qualified-duckgres-image
          path: ${{ runner.temp }}/qualified-image

      - name: Verify the archive and restore its qualified image ID
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.validate.outputs.archive_sha256 }}
          EXPECTED_IMAGE_ID: ${{ needs.validate.outputs.image_id }}
        run: sh scripts/bundle-ci/restore.sh "$RUNNER_TEMP/qualified-image" "$EXPECTED_ARCHIVE_SHA256" "$EXPECTED_IMAGE_ID"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified image without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_IMAGE_ID: ${{ needs.validate.outputs.image_id }}
        run: sh scripts/bundle-ci/publish.sh "$VERIFIED_IMAGE_ID" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
