name: duckgres-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: duckgres-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Short sha
        id: sha
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/duckgres:latest
            ghcr.io/${{ steps.owner.outputs.value }}/duckgres:sha-${{ steps.sha.outputs.value }}
          build-args: |
            VERSION=sha-${{ steps.sha.outputs.value }}
            COMMIT=${{ github.sha }}
            BUILD_TAGS=kubernetes
          cache-from: type=gha,scope=duckgres
          cache-to: type=gha,mode=max,scope=duckgres
          provenance: false
