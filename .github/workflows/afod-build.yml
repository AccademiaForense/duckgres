name: afod-build

on:
  push:
    branches: [afod-patched]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Owner in minuscolo
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ steps.owner.outputs.value }}/duckgres:sha-${{ github.sha }}
            ${{ env.GHCR_REGISTRY }}/${{ steps.owner.outputs.value }}/duckgres:afod-patched
          build-args: |
            VERSION=afod-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TAGS=kubernetes
          cache-from: type=gha,scope=afod-duckgres-amd64
          cache-to: type=gha,mode=max,scope=afod-duckgres-amd64
          provenance: false
